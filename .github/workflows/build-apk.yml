name: Flutter Build & Fix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # تثبيت Java 17 (ضروري للبناء الحديث)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # تثبيت Flutter Stable
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # تحميل الحزم
      - run: flutter pub get
      
      # تحليل الكود (مع تجاهل الأخطاء البسيطة للمتابعة)
      - run: flutter analyze || true
      
      # ⚠️ ملاحظة مهمة: نحن لا نشغل flutter create هنا
      # لأننا نثق بأن مجلد android/ موجود ومصلح في المستودع
      
      # بناء APK للتجربة (Debug)
      - run: flutter build apk --debug
      
      # رفع الناتج للتحميل
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
